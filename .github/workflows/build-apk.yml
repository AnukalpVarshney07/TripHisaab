name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Flet CLI
        run: pip install --upgrade pip flet==1.1.2

      - name: Build Android APK
        run: flet build apk --arch arm64-v8a -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-hisaab-apk
          path: build/flutter/build/app/outputs/flutter-apk/*.apk
